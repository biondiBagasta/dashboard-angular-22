<div class="layout">
    <aside [class]="isExpandedSidebar() ? 'sidebar' : 'sidebar close'">
      <div class="mt-3">
          <div class="logo-details">
            <img src="assets/images/angular-logo.png"
            class="logo-image" />
          </div>
      </div>
      <ul class="nav-links mt-5">
        <sidebar-menu-item-component name="Dashboard" routerLink="dashboard" icon="@tui.chart-column" />
        <sidebar-menu-item-component name="Product" routerLink="product"
        icon="@tui.package-open" />
        <sidebar-menu-item-component name="Restock" routerLink="restock" icon="@tui.package-plus" />
        <sidebar-menu-item-component name="Order History"
        routerLink="order-history" icon="@tui.clipboard-list" />
        <sidebar-menu-item-component name="Create Order" routerLink="order-create" icon="@tui.shopping-cart" />
      </ul>

    </aside>

    <main class="home-section">
      <div class="top-navbar">
        <div class="bx-menu mt-2" (click)="toggleSidebar()">
          <tui-icon
              icon="@tui.menu" class="text-black"
          />

        </div>
        <ng-container>
          <div class="header-user mt-2 cursor-pointer" (click)="toggleRightMenuDropdown()">
              <div class="flex-1 min-w-0 text-base text-black truncate">
                {{ authenticatedUser$()?.full_name }}
              </div>
            <div tuiAvatar="@tui.user" appearance="primary-grayscale">
              <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" />
            </div>
          </div>
          @if(isToggeledRightMenuDropdown() == true) {
              <div class="dropdown-user">
                  <div tuiAvatar="@tui.user" appearance="info" size="xl">

                  </div>
                  <div class="font-semibold text-base">
                    {{ authenticatedUser$()?.full_name }}
                  </div>
                  <div class="w-full flex flex-col gap-2 mt-2">
                    <button type="submit" tuiButton size="s" class="w-full">Profil</button>
                    <button size="s" type="submit" tuiButton appearance="negative"
                    class="w-full"
                    (click)="logout()">Logout</button>
                  </div>
              </div>
          }

        </ng-container>
      </div>
      <div class="p-3">
        <router-outlet></router-outlet>
      </div>
    </main>
</div>
