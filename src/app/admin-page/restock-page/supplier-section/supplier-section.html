<div tuiCardLarge tuiAppearance="outline-grayscale">
  <div class="text-base font-semibold">
    Supplier Data
  </div>
  <div class="flex flex-row items-center gap-4">
    <button tuiButton size="m" iconStart="@tui.plus" appearance="primary-grayscale"
    (click)="openCreateDialog()">
      Add
    </button>
  </div>

  <div class="w-full">
    <tui-loader [loading]="isLoadingTable$()" [size]="'m'" [overlay]="true"
    [textContent]="'Loading the Data...'">
      <div class="w-full overflow-x-auto overflow-y-hidden">
        <table tuiTable class="mb-2 min-w-full">
          <thead>
            <tr tuiThGroup>
              <th tuiTh>
                Name
              </th>
              <th tuiTh>
                Address
              </th>
              <th tuiTh>
                Phone Number
              </th>
              <th tuiTh>
                Active
              </th>
              <th tuiTh>Action</th>
            </tr>
          </thead>
          <tbody tuiTbody>
            @for (item of supplierList(); track $index) {
              <tr>
                <td tuiTd>
                  {{ item.name }}
                </td>
                <td tuiTd>
                  {{ item.address }}
                </td>
                <td tuiTd>
                  {{ item.phone_number }}
                </td>
                <td tuiTd>
                  @if(item.active == 1) {
                    <div tuiBadge appearance="positive" tuiStatus>
                      Active
                    </div>
                  } @else {
                    <div tuiBadge appearance="negative" tuiStatus>
                      Not Active
                    </div>
                  }
                </td>
                <td tuiTd>
                  <div class="flex flex-col md:flex-row gap-2">
                    <button tuiIconButton type="button"
                    iconStart="@tui.square-pen" appearance="info"
                    (click)="openEditDialog(item)"
                      size="s">
                    </button>
                    <button tuiIconButton
                      type="button" iconStart="@tui.trash"
                      size="s" appearance="negative"
                      (click)="openDeleteDialog(item)">
                    </button>
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      @if(supplierList().length == 0) {
        <div tuiNotification size="l">
          No Item Data
        </div>
      }
    </tui-loader>
  </div>
</div>

<ng-template [tuiDialogOptions]="{ size: 'l', dismissible: false, closable: false }"
  [(tuiDialog)]="isOpenedCreateDialog">
  <app-supplier-form (onClose)="closeCreateDialog()" [formGroup]="supplierForm"
  [isLoadingSubmit]="isLoadingSubmit$()" title="Create Supplier" (onSubmit)="createData()" />
</ng-template>


<ng-template [tuiDialogOptions]="{ size: 'l', dismissible: false, closable: false }"
  [(tuiDialog)]="isOpenedEditDialog">
  <app-supplier-form (onClose)="closeEditDialog()" [formGroup]="supplierForm"
  [isLoadingSubmit]="isLoadingSubmit$()" title="Update Supplier" (onSubmit)="updateData()" />
</ng-template>

<ng-template [tuiDialogOptions]="{ size: 'l', dismissible: false, closable: false }"
  [(tuiDialog)]="isOpenedDeleteDialog">
  <delete-dialog title="Delete Supplier"
  [(isLoadingSubmit)]="isLoadingSubmit$"
  [description]="`Are you sure want to delete this <b>${selectedData$()?.name!}</b> Supplier Data???`"
  (onClose)="closeDeleteDialog()"
  (onSubmit)="deleteData()" />
</ng-template>
