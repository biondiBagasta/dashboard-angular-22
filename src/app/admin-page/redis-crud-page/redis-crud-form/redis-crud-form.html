<tui-loader [loading]="isLoadingSubmit()" [size]="'m'"
  [overlay]="true" [textContent]="'Submitting in Progress....'">
  <div class="w-full flex flex-col gap-4">
    <div class="font-bold text-2xl">
      {{ title() }}
    </div>
    <form [formGroup]="formGroup()" class="w-full flex flex-col gap-4">
      <input-text-component label="Name" placeholder="Category Name"
      [control]="formGroup().controls.name" />
      <input-currency-component label="Price" placeholder="Price" [control]="formGroup().controls.price" />
    </form>
    <div class="flex flex-row justify-content-end gap-2">
      <button tuiButton class="mr-2" type="submit" size="m"
      iconStart="@tui.check"
      (click)="onSubmit.emit()" [disabled]="!formGroup().valid">
        Submit
      </button>
      <button tuiButton type="button" size="m" iconStart="@tui.x" appearance="warning"
      (click)="onClose.emit()">
        Cancel
      </button>
    </div>
  </div>
</tui-loader>
