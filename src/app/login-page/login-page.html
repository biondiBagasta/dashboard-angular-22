<div class="w-full h-screen flex flex-col justify-center items-center p-5">
	<tui-loader [loading]="isLoadingSubmit$()" [size]="'xxl'" [overlay]="true" [textContent]="'Proses Login...'">
    <div tuiCardLarge appearance="floating" class="w-full flex flex-col items-center md:w-2xl
    h-auto">
        <img src="assets/images/angular-logo.png"
        class="mx-auto h-32 w-auto"/>

        <form [formGroup]="loginForm" class="w-full flex flex-col gap-4">
          <div class="flex flex-col gap-4 w-full">
            <input-text-component label="Username"
            [control]="loginForm.controls.username"
            placeholder="Username"
            icon="@tui.user-round" />

            <input-password-component label="Password"
            placeholder="Password" [control]="loginForm.controls.password" icon="@tui.key-round" />

            <button tuiButton class="w-full" size="s">
              Login
            </button>
          </div>
        </form>
    </div>
  </tui-loader>
</div>
