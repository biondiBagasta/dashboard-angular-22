<div class="w-full">
  <tui-textfield [iconStart]="icon() ? icon() : undefined"
  tuiTextfieldSize="m">
    <label tuiLabel>{{ label() }}</label>
    <input
      type="text"
        [placeholder]="placeholder()"
        tuiInput
        type="password"
        [formControl]="control()"
    />
    <tui-icon tuiPassword />
  </tui-textfield>
  <tui-error [formControl]="control()"></tui-error>
</div>
